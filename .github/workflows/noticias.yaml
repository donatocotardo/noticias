name: Noticias diarias

on:
  schedule:
    - cron: "43 6 * * *"
    - cron: "43 7 * * *"
    - cron: "43 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Descargar datos privados
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATOS_REPO }}
          token: ${{ secrets.DATOS_TOKEN }}
          path: datos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt


      - run: pip install -r requirements.txt

      - name: Caché del modelo de embeddings
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-modelo-v1

      - name: Enviar noticias
        env:
          DATOS_DIR: datos
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
          EMBED_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
          EMBED_UMBRAL: "0.55"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          python main.py --enviar --semantico ${{ github.event_name == 'schedule' && '--una-al-dia' || '' }}

      - name: Guardar noticias vistas
        working-directory: datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiza historial de noticias vistas"
            for i in 1 2 3; do
              if git pull --rebase && git push; then exit 0; fi
              sleep 5
            done
            exit 1
          fi